# Mental Health Chatbot Agent API Contract
# Fragment consumed by Bedrock Agents to pick and invoke actions via Lambda.

paths:
  /chat:
    post:
      summary: General conversation and emotional support
      description: >
        Provides empathetic conversation and emotional support. The agent responds to user messages
        with understanding, validation, and helpful guidance while maintaining a supportive tone.
        This endpoint handles general mental health conversations and emotional support.
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Unique identifier for the user
                message:
                  type: string
                  description: User's message or question
                conversation_history:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: ["user", "assistant"] }
                      content: { type: string }
                      timestamp: { type: string, format: "date-time" }
                  description: Previous conversation context (optional)
                mood_context:
                  type: object
                  properties:
                    current_mood: { type: string, description: "User's current mood (happy, sad, anxious, etc.)" }
                    stress_level: { type: integer, minimum: 1, maximum: 10, description: "Stress level 1-10" }
                  description: Current mood context (optional)
            examples:
              general_chat:
                summary: General conversation
                value: { "user_id": "user123", "message": "I'm feeling overwhelmed with work lately" }
              mood_context:
                summary: Chat with mood context
                value: { "user_id": "user123", "message": "I had a rough day", "mood_context": { "current_mood": "sad", "stress_level": 8 } }
      responses:
        "200":
          description: Chat response generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: { type: string, description: "Agent's empathetic response" }
                  suggestions: 
                    type: array
                    items: { type: string }
                    description: "Optional helpful suggestions or coping strategies"
                  follow_up_questions:
                    type: array
                    items: { type: string }
                    description: "Optional follow-up questions to continue the conversation"
                  mood_detected: { type: string, description: "Detected mood from the conversation" }
                  conversation_id: { type: string, description: "Unique conversation identifier" }
        "400":
          description: Invalid request (missing user_id or message)
        "500":
          description: Chat processing failed due to internal error
      x-amazon-bedrock-integration:
        actionType: LAMBDA
        uri: arn:aws:lambda:${region}:${account-id}:function:mh-chat-handler

  /daily-checkin:
    post:
      summary: Daily mental health check-in questionnaire
      description: >
        Conducts a structured daily check-in to assess the user's mental health status.
        Asks simple, non-intrusive questions about mood, energy, sleep, and stress levels.
        This data is used for mental health evaluation and personalized recommendations.
      operationId: dailyCheckin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Unique identifier for the user
                checkin_type:
                  type: string
                  enum: ["morning", "evening", "custom"]
                  description: "Type of check-in (morning routine, evening reflection, or custom)"
                responses:
                  type: object
                  properties:
                    mood_rating: { type: integer, minimum: 1, maximum: 10, description: "Overall mood 1-10" }
                    energy_level: { type: integer, minimum: 1, maximum: 10, description: "Energy level 1-10" }
                    sleep_quality: { type: integer, minimum: 1, maximum: 10, description: "Sleep quality 1-10" }
                    stress_level: { type: integer, minimum: 1, maximum: 10, description: "Stress level 1-10" }
                    anxiety_level: { type: integer, minimum: 1, maximum: 10, description: "Anxiety level 1-10" }
                    social_connection: { type: integer, minimum: 1, maximum: 10, description: "Feeling of social connection 1-10" }
                    productivity: { type: integer, minimum: 1, maximum: 10, description: "Productivity level 1-10" }
                    gratitude: { type: string, description: "One thing they're grateful for today" }
                    challenges: { type: string, description: "Main challenge or concern today" }
                    goals: { type: string, description: "One goal for today" }
                  description: "Structured responses to check-in questions"
                additional_notes:
                  type: string
                  description: "Any additional thoughts or feelings to share"
            examples:
              morning_checkin:
                summary: Morning check-in
                value: 
                  user_id: "user123"
                  checkin_type: "morning"
                  responses:
                    mood_rating: 7
                    energy_level: 6
                    sleep_quality: 8
                    stress_level: 4
                    anxiety_level: 3
                    social_connection: 7
                    productivity: 6
                    gratitude: "Having a good cup of coffee"
                    goals: "Finish the presentation"
      responses:
        "200":
          description: Check-in completed and data stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkin_id: { type: string, description: "Unique check-in identifier" }
                  message: { type: string, description: "Encouraging response to the user" }
                  insights: { type: string, description: "Brief insights about their responses" }
                  recommendations: 
                    type: array
                    items: { type: string }
                    description: "Immediate recommendations based on check-in"
                  next_checkin_suggested: { type: string, description: "Suggested time for next check-in" }
        "400":
          description: Invalid check-in data
        "500":
          description: Check-in processing failed
      x-amazon-bedrock-integration:
        actionType: LAMBDA
        uri: arn:aws:lambda:${region}:${account-id}:function:mh-daily-checkin

  /evaluate-mental-health:
    post:
      summary: Quantitative mental health evaluation
      description: >
        Analyzes the user's mental health data from check-ins and conversations to provide
        a quantitative assessment. Uses historical data, trends, and patterns to evaluate
        overall mental health status and identify areas of concern or improvement.
      operationId: evaluateMentalHealth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Unique identifier for the user
                evaluation_period:
                  type: string
                  enum: ["week", "month", "quarter", "custom"]
                  description: "Time period for evaluation"
                include_chat_analysis:
                  type: boolean
                  default: true
                  description: "Include analysis of chat conversations"
                include_checkin_data:
                  type: boolean
                  default: true
                  description: "Include check-in questionnaire data"
            examples:
              weekly_evaluation:
                summary: Weekly mental health evaluation
                value: 
                  user_id: "user123"
                  evaluation_period: "week"
                  include_chat_analysis: true
                  include_checkin_data: true
      responses:
        "200":
          description: Mental health evaluation completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation_id: { type: string, description: "Unique evaluation identifier" }
                  overall_score: { type: number, minimum: 0, maximum: 100, description: "Overall mental health score 0-100" }
                  mood_trend: { type: string, enum: ["improving", "stable", "declining"], description: "Mood trend over time" }
                  stress_level: { type: string, enum: ["low", "moderate", "high", "critical"], description: "Current stress level" }
                  risk_factors: 
                    type: array
                    items: { type: string }
                    description: "Identified risk factors or areas of concern"
                  strengths: 
                    type: array
                    items: { type: string }
                    description: "Identified strengths and positive patterns"
                  recommendations: 
                    type: array
                    items: { type: string }
                    description: "Specific recommendations for improvement"
                  follow_up_needed: { type: boolean, description: "Whether immediate follow-up is recommended" }
                  next_evaluation_date: { type: string, format: "date", description: "Suggested date for next evaluation" }
        "400":
          description: Invalid evaluation request
        "500":
          description: Evaluation processing failed
      x-amazon-bedrock-integration:
        actionType: LAMBDA
        uri: arn:aws:lambda:${region}:${account-id}:function:mh-evaluate-mental-health

  /recommendations:
    post:
      summary: Personalized mental health recommendations
      description: >
        Provides personalized recommendations based on mental health evaluation and user preferences.
        Suggests content like funny videos, relaxation techniques, yoga videos, meditation,
        breathing exercises, or other wellness activities tailored to the user's current needs.
      operationId: recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Unique identifier for the user
                recommendation_type:
                  type: string
                  enum: ["immediate", "daily", "weekly", "stress_relief", "mood_boost", "sleep_aid"]
                  description: "Type of recommendations needed"
                current_mood:
                  type: string
                  description: "User's current mood for context"
                preferences:
                  type: object
                  properties:
                    content_types: 
                      type: array
                      items: { type: string, enum: ["video", "audio", "text", "interactive"] }
                    duration: { type: string, enum: ["short", "medium", "long"] }
                    activity_level: { type: string, enum: ["low", "moderate", "high"] }
                    interests: 
                      type: array
                      items: { type: string }
                  description: "User preferences for recommendations"
                urgency_level:
                  type: string
                  enum: ["low", "medium", "high"]
                  description: "How urgently recommendations are needed"
            examples:
              stress_relief:
                summary: Stress relief recommendations
                value:
                  user_id: "user123"
                  recommendation_type: "stress_relief"
                  current_mood: "anxious"
                  preferences:
                    content_types: ["video", "audio"]
                    duration: "short"
                    activity_level: "low"
                  urgency_level: "high"
      responses:
        "200":
          description: Personalized recommendations generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendation_id: { type: string, description: "Unique recommendation identifier" }
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string, description: "Recommendation title" }
                        type: { type: string, description: "Type of recommendation (video, exercise, etc.)" }
                        description: { type: string, description: "Brief description" }
                        url: { type: string, description: "Link to content or resource" }
                        duration: { type: string, description: "Estimated time to complete" }
                        difficulty: { type: string, enum: ["beginner", "intermediate", "advanced"] }
                        mood_benefit: { type: string, description: "Expected mood benefit" }
                        priority: { type: string, enum: ["high", "medium", "low"] }
                  personalized_message: { type: string, description: "Encouraging message for the user" }
                  follow_up_suggestions: 
                    type: array
                    items: { type: string }
                    description: "Additional suggestions for the user"
        "400":
          description: Invalid recommendation request
        "500":
          description: Recommendation generation failed
      x-amazon-bedrock-integration:
        actionType: LAMBDA
        uri: arn:aws:lambda:${region}:${account-id}:function:mh-recommendations

  /schedule-checkin:
    post:
      summary: Schedule proactive check-ins based on mental health status
      description: >
        Determines when to proactively check in with the user based on their mental health
        evaluation. If mental health is poor, schedules check-ins for the same time tomorrow.
        If mental health is good, schedules less frequent check-ins. This helps maintain
        consistent support without being overwhelming.
      operationId: scheduleCheckin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Unique identifier for the user
                mental_health_score:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: "Current mental health score from evaluation"
                risk_level:
                  type: string
                  enum: ["low", "moderate", "high", "critical"]
                  description: "Assessed risk level"
                user_preferences:
                  type: object
                  properties:
                    preferred_checkin_times: 
                      type: array
                      items: { type: string }
                    max_checkins_per_week: { type: integer, minimum: 1, maximum: 7 }
                    notification_methods: 
                      type: array
                      items: { type: string, enum: ["push", "email", "sms"] }
                  description: "User preferences for check-ins"
                last_checkin_date:
                  type: string
                  format: "date-time"
                  description: "Date of last check-in"
            examples:
              schedule_based_on_score:
                summary: Schedule check-in based on mental health score
                value:
                  user_id: "user123"
                  mental_health_score: 35
                  risk_level: "high"
                  user_preferences:
                    preferred_checkin_times: ["09:00", "18:00"]
                    max_checkins_per_week: 5
                    notification_methods: ["push", "email"]
                  last_checkin_date: "2024-01-15T09:00:00Z"
      responses:
        "200":
          description: Check-in schedule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule_id: { type: string, description: "Unique schedule identifier" }
                  next_checkin_date: { type: string, format: "date-time", description: "Scheduled date for next check-in" }
                  checkin_frequency: { type: string, description: "Recommended check-in frequency" }
                  reasoning: { type: string, description: "Explanation for the scheduling decision" }
                  notification_scheduled: { type: boolean, description: "Whether notifications were scheduled" }
                  message: { type: string, description: "Message to send to user about the schedule" }
        "400":
          description: Invalid scheduling request
        "500":
          description: Scheduling failed
      x-amazon-bedrock-integration:
        actionType: LAMBDA
        uri: arn:aws:lambda:${region}:${account-id}:function:mh-schedule-checkin
